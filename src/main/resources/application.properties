# Configuración de aplicación Spring Boot
# Servidor web

server.port=8080
server.error.include-stacktrace=never

# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tu_base_de_datos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=tu_usuario
spring.datasource.password=tu_contraseña
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Configuración de seguridad
app.jwtSecret=tu_clave_secreta_muy_segura_y_alta_1234567890
app.jwtExpirationMs=86400000

# Configuración de logging
logging.level.com.ejemplo=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/aplicacion.log
logging.file.max-size=10MB
logging.file.max-history=7

# Configuración de CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Configuración de recursos estáticos
spring.web.resources.static-locations=classpath:/static/